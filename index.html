<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --ink: #1b2430;
    --muted: #66717f;
    --line: #e2e6eb;
    --accent: #1f5f6b;
    --accent-soft: #e6f0f2;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
  }
  main { max-width: 960px; margin: 0 auto; padding: 64px 24px 80px; }

  header { margin-bottom: 40px; }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  .lede { color: var(--muted); margin: 0; max-width: 52ch; }

  .tools {
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .search { position: relative; flex: 1 1 280px; max-width: 420px; }
  .search svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2;
  }
  .search input {
    width: 100%; height: 44px; padding: 0 16px 0 42px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink);
    font: inherit;
  }
  .search input::placeholder { color: #98a2b0; }
  .count { color: var(--muted); font-size: 0.92rem; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 16px 22px; }
  thead th {
    background: #fafbfc;
    border-bottom: 1px solid var(--line);
    font-weight: 600; font-size: 0.9rem; color: var(--muted);
    white-space: nowrap;
  }
  thead button {
    all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
  }
  thead button:hover { color: var(--ink); }
  thead button:focus-visible, .search input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .arrow { font-size: 0.75rem; color: var(--accent); }
  tbody tr + tr td { border-top: 1px solid var(--line); }
  tbody tr:hover { background: #fafbfc; }
  td { vertical-align: top; }
  td.primary { font-weight: 600; }
  .pill {
    display: inline-block; padding: 2px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-weight: 500; font-size: 0.9rem;
  }

  .state { padding: 56px 24px; text-align: center; color: var(--muted); }
  .state strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }
  .spinner {
    width: 22px; height: 22px; margin: 0 auto 14px;
    border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  @media (max-width: 640px) {
    main { padding: 40px 16px 56px; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { padding: 14px 18px; }
    tbody tr + tr { border-top: 1px solid var(--line); }
    tbody tr + tr td { border-top: 0; }
    td { padding: 4px 0; display: flex; gap: 12px; justify-content: space-between; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 0.88rem; flex: none; }
  }

  .badge { display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 0.88rem; font-weight: 500; }
  .badge.ok { background: #e3f1ea; color: #1d6b45; }
  .badge.no { background: #f9e7e7; color: #9b2c2c; }
  .sum { color: var(--muted); white-space: nowrap; }
  .dim { color: #b3bbc6; }

  .right { display: flex; align-items: center; gap: 16px; }
  .btn {
    height: 44px; padding: 0 20px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
    font: inherit; font-weight: 600;
  }
  .btn:hover { background: #194f59; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { background: #fafbfc; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .formpanel { margin-bottom: 16px; padding: 22px; }
  .formpanel[hidden] { display: none; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
  .fields label { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; color: var(--muted); font-weight: 500; }
  .fields input, .fields select {
    height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink); font: inherit;
  }
  .fields input:focus-visible, .fields select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 20px; }
  .msg { font-size: 0.92rem; color: var(--muted); }
  .msg.err { color: #9b2c2c; }
  .msg.good { color: #1d6b45; }
  @media (max-width: 640px) { .right { width: 100%; justify-content: space-between; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Lab Attendance</h1>
    <p class="lede">Daily attendance records for every lab session, pulled live from the class database.</p>
  </header>

  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search by student, subject or section" autocomplete="off" aria-label="Search records">
    </label>
    <div class="right"><span class="count" id="count" aria-live="polite"></span><button class="btn" id="toggleForm" type="button">Add record</button></div>
  </div>

    <form class="panel formpanel" id="addForm" hidden>
    <div class="fields" id="fields"></div>
    <div class="actions">
      <button class="btn" type="submit" id="saveBtn">Save record</button>
      <button class="btn ghost" type="button" id="cancelForm">Close</button>
      <span class="msg" id="msg" aria-live="polite"></span>
    </div>
  </form>

  <div class="panel">
    <div class="scroll" id="view">
      <div class="state"><div class="spinner"></div>Loading records…</div>
    </div>
  </div>
</main>

<script>
  // Palitan ito ng sarili mong Vercel URL
  const VERCEL_API_URL = 'https://student-api-backend-two.vercel.app/api';

  const view = document.getElementById('view');
  const countEl = document.getElementById('count');
  const searchEl = document.getElementById('q');

  let rows = [], infoCols = [], dates = [], attKey = null;
  let sortKey = null, sortDir = 1;

  const day = v => String(v).slice(0, 10);

  function pretty(key) {
    const s = key.replace(/[_-]+/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').trim().toLowerCase();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function shortDate(d) {
    const t = new Date(d + 'T00:00:00Z');
    return isNaN(t) ? d : t.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  const getAtt = r => (attKey && Array.isArray(r[attKey])) ? r[attKey] : [];
  const statusOn = (r, d) => {
    const e = getAtt(r).find(x => day(x.date) === d);
    return e ? String(e.status) : '';
  };
  const presentCount = r => getAtt(r).filter(x => /present/i.test(x.status)).length;

  function valueOf(r, key) {
    if (key === '__sum') return presentCount(r);
    if (key.startsWith('d:')) return statusOn(r, key.slice(2));
    return r[key] ?? '';
  }

  function showState(title, text) {
    view.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'state';
    const s = document.createElement('strong');
    s.textContent = title;
    d.appendChild(s);
    d.appendChild(document.createTextNode(text));
    view.appendChild(d);
  }

  function getColumns() {
    const cols = infoCols.map(c => ({ key: c, label: pretty(c) }));
    dates.forEach(d => cols.push({ key: 'd:' + d, label: shortDate(d) }));
    if (attKey) cols.push({ key: '__sum', label: 'Present' });
    return cols;
  }

  function render() {
    const term = searchEl.value.trim().toLowerCase();
    let list = rows.filter(r => !term || infoCols.some(c => String(r[c] ?? '').toLowerCase().includes(term)));

    if (sortKey) {
      list = list.slice().sort((a, b) =>
        String(valueOf(a, sortKey)).localeCompare(String(valueOf(b, sortKey)), undefined, { numeric: true }) * sortDir);
    }

    countEl.textContent = list.length + (list.length === 1 ? ' record' : ' records');

    if (list.length === 0) {
      showState('No matching records', 'Try a different name, subject or section.');
      return;
    }

    const cols = getColumns();
    const table = document.createElement('table');
    const head = table.createTHead().insertRow();

    cols.forEach(c => {
      const th = document.createElement('th');
      th.scope = 'col';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = c.label;
      if (sortKey === c.key) {
        const a = document.createElement('span');
        a.className = 'arrow';
        a.textContent = sortDir === 1 ? '▲' : '▼';
        btn.appendChild(a);
      }
      btn.addEventListener('click', () => {
        sortDir = sortKey === c.key ? -sortDir : 1;
        sortKey = c.key;
        render();
      });
      th.appendChild(btn);
      head.appendChild(th);
    });

    const body = table.createTBody();
    list.forEach(r => {
      const tr = body.insertRow();
      cols.forEach(c => {
        const td = tr.insertCell();
        td.dataset.label = c.label;

        if (c.key === '__sum') {
          td.className = 'sum';
          td.textContent = presentCount(r) + ' of ' + getAtt(r).length;
        } else if (c.key.startsWith('d:')) {
          const st = statusOn(r, c.key.slice(2));
          if (!st) {
            td.innerHTML = '<span class="dim">—</span>';
          } else {
            const b = document.createElement('span');
            b.className = 'badge ' + (/present/i.test(st) ? 'ok' : 'no');
            b.textContent = st;
            td.appendChild(b);
          }
        } else if (/section/i.test(c.key)) {
          const p = document.createElement('span');
          p.className = 'pill';
          p.textContent = r[c.key] ?? '—';
          td.appendChild(p);
        } else {
          td.textContent = r[c.key] ?? '—';
          if (/student/i.test(c.key)) td.className = 'primary';
        }
      });
    });

    view.innerHTML = '';
    view.appendChild(table);
  }

  async function load() {
    try {
      const res = await fetch(VERCEL_API_URL);
      if (!res.ok) throw new Error('Request failed');
      const data = await res.json();

      if (!Array.isArray(data) || data.length === 0) {
        countEl.textContent = '';
        showState('No records yet', 'Attendance entries will appear here once they are added to the database.');
        return;
      }

      rows = data;

      // Hanapin ang field na array ng { date, status }
      const keys = [];
      data.forEach(r => Object.keys(r).forEach(k => {
        if (k !== '_id' && k !== '__v' && !keys.includes(k)) keys.push(k);
      }));
      attKey = keys.find(k => data.some(r => Array.isArray(r[k]) && r[k].length && typeof r[k][0] === 'object')) || null;

      // Student, subject, section muna; kasunod ang iba
      const rank = k => /student/i.test(k) ? 0 : /subject/i.test(k) ? 1 : /section/i.test(k) ? 2 : 3;
      infoCols = keys.filter(k => k !== attKey).sort((a, b) => rank(a) - rank(b));

      const set = new Set();
      data.forEach(r => getAtt(r).forEach(x => set.add(day(x.date))));
      dates = Array.from(set).sort();

      sortKey = infoCols.find(c => /student/i.test(c)) || infoCols[0] || null;

      buildForm();
      render();
    } catch (err) {
      countEl.textContent = '';
      showState('Could not load records', 'Check your connection and refresh the page. If it keeps happening, the API may be offline.');
    }
  }


  const addForm = document.getElementById('addForm');
  const msgEl = document.getElementById('msg');

  function setMsg(text, kind) {
    msgEl.textContent = text;
    msgEl.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function buildForm() {
    const box = document.getElementById('fields');
    box.innerHTML = '';

    const add = (label, input, extra) => {
      const l = document.createElement('label');
      const t = document.createElement('span');
      t.textContent = label;
      l.appendChild(t);
      l.appendChild(input);
      if (extra) l.appendChild(extra);
      box.appendChild(l);
    };

    infoCols.forEach(c => {
      const input = document.createElement('input');
      input.type = 'text';
      input.name = 'f_' + c;
      input.required = true;
      input.autocomplete = 'off';
      input.maxLength = 100;

      const dl = document.createElement('datalist');
      dl.id = 'dl_' + c;
      Array.from(new Set(rows.map(r => r[c]).filter(Boolean))).sort().forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        dl.appendChild(o);
      });
      input.setAttribute('list', dl.id);

      // Kapag existing na estudyante ang pinili, kusang pupunuin ang subject at section
      if (/student/i.test(c)) {
        input.addEventListener('change', () => {
          const found = rows.find(r => r[c] === input.value.trim());
          if (!found) return;
          infoCols.forEach(o => {
            if (o !== c) addForm.elements['f_' + o].value = found[o] ?? '';
          });
        });
      }
      add(pretty(c), input, dl);
    });

    const date = document.createElement('input');
    date.type = 'date';
    date.name = 'date';
    date.required = true;
    date.value = new Date().toISOString().slice(0, 10);
    add('Date', date);

    const status = document.createElement('select');
    status.name = 'status';
    ['Present', 'Absent'].forEach(v => {
      const o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      status.appendChild(o);
    });
    add('Status', status);

    const pass = document.createElement('input');
    pass.type = 'password';
    pass.name = 'passcode';
    pass.required = true;
    pass.autocomplete = 'off';
    add('Passcode', pass);
  }

  document.getElementById('toggleForm').addEventListener('click', () => {
    addForm.hidden = !addForm.hidden;
    if (!addForm.hidden) {
      setMsg('');
      const first = addForm.querySelector('input');
      if (first) first.focus();
    }
  });
  document.getElementById('cancelForm').addEventListener('click', () => { addForm.hidden = true; });

  addForm.addEventListener('submit', async e => {
    e.preventDefault();
    const match = {};
    infoCols.forEach(c => { match[c] = addForm.elements['f_' + c].value.trim(); });

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    setMsg('Saving…');

    try {
      const res = await fetch(VERCEL_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-admin-passcode': addForm.elements.passcode.value
        },
        body: JSON.stringify({
          match,
          attKey: attKey || 'attendance',
          date: addForm.elements.date.value,
          status: addForm.elements.status.value
        })
      });

      if (res.status === 401) { setMsg('Wrong passcode. Try again.', 'err'); return; }
      if (!res.ok) { setMsg('Could not save. Check the fields and try again.', 'err'); return; }

      const out = await res.json();
      await load();
      setMsg(out.updated ? 'Attendance updated.' : 'Record saved.', 'good');
    } catch (err) {
      setMsg('Could not reach the server. Check your connection.', 'err');
    } finally {
      btn.disabled = false;
    }
  });

  searchEl.addEventListener('input', render);
  load();
</script>
</body>
</html>
