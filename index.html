<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg:#f4f5f7; --surface:#fff; --head:#fafbfc; --ink:#17202b; --muted:#667282; --line:#e3e7ec;
    --accent:#1f5f6b; --accent-ink:#fff; --accent-soft:#e5f0f2;
    --ok:#1d6b45; --ok-bg:#e2f1e9; --no:#9b2c2c; --no-bg:#f8e6e6;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1418; --surface:#171e24; --head:#1b242b; --ink:#e8edf2; --muted:#8d9aa8; --line:#27313a;
      --accent:#5fb3c2; --accent-ink:#0b1a1e; --accent-soft:#17323a;
      --ok:#6fd3a0; --ok-bg:#16322a; --no:#f08a8a; --no-bg:#3a1f22;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--sans); }
  main { max-width:1040px; margin:0 auto; padding:56px 24px 80px; }

  .top { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end; justify-content:space-between; margin-bottom:32px; }
  h1 { font-family:var(--serif); font-weight:600; font-size:clamp(2.2rem,5vw,3.2rem); line-height:1.08; letter-spacing:-.02em; margin:0 0 10px; }
  .lede { color:var(--muted); margin:0; max-width:50ch; }

  .btn { height:44px; padding:0 20px; border-radius:10px; cursor:pointer; border:1px solid var(--accent);
    background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:600; }
  .btn:hover { filter:brightness(1.08); }
  .btn.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
  .btn.ghost:hover { background:var(--head); filter:none; }
  .btn:disabled { opacity:.6; cursor:default; }
  :is(.btn,input,select,th button):focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:28px; }
  .stat { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .stat small { display:block; color:var(--muted); font-size:.88rem; font-weight:500; }
  .stat b { display:block; font-family:var(--serif); font-size:2rem; font-weight:600; letter-spacing:-.02em; margin-top:4px; }

  .tools { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  .search { position:relative; flex:1 1 260px; max-width:380px; }
  .search svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:var(--muted); fill:none; stroke-width:2; }
  input, select { height:44px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); font:inherit; padding:0 14px; }
  .search input { width:100%; padding-left:42px; }
  select { padding-right:10px; max-width:100%; }
  .grow { flex:1; }
  .count { color:var(--muted); font-size:.92rem; }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:15px 20px; }
  thead th { background:var(--head); border-bottom:1px solid var(--line); font-size:.88rem; font-weight:600; color:var(--muted); white-space:nowrap; }
  th button { all:unset; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  th button:hover { color:var(--ink); }
  .arrow { font-size:.7rem; color:var(--accent); }
  tbody tr + tr td { border-top:1px solid var(--line); }
  tbody tr:hover { background:var(--head); }
  td { vertical-align:middle; }
  td.primary { font-weight:600; }
  .pill { display:inline-block; padding:2px 12px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:500; font-size:.9rem; }
  .badge { display:inline-block; padding:2px 12px; border-radius:999px; font-size:.86rem; font-weight:500; }
  .badge.ok { background:var(--ok-bg); color:var(--ok); }
  .badge.no { background:var(--no-bg); color:var(--no); }
  .dim { color:var(--muted); opacity:.6; }
  .rate { min-width:96px; font-weight:600; font-size:.92rem; }
  .bar { height:6px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:999px; }

  .state { padding:56px 24px; text-align:center; color:var(--muted); }
  .state strong { display:block; color:var(--ink); font-size:1.05rem; margin-bottom:6px; }
  .state .btn { margin-top:16px; }
  .skel { padding:22px; display:grid; gap:14px; }
  .skel i { height:18px; border-radius:6px; background:linear-gradient(90deg,var(--line),var(--head),var(--line)); background-size:200% 100%; animation:sh 1.3s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }

  .formpanel { margin-bottom:16px; padding:22px; }
  .formpanel[hidden] { display:none; }
  .formpanel h2 { font-family:var(--serif); font-size:1.3rem; margin:0 0 16px; }
  .fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; }
  .fields label { display:flex; flex-direction:column; gap:6px; font-size:.9rem; color:var(--muted); font-weight:500; }
  .fields input, .fields select { height:42px; }
  .actions { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:20px; }
  .msg { font-size:.92rem; color:var(--muted); }
  .msg.err { color:var(--no); }

  .toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); background:var(--ink); color:var(--bg);
    padding:12px 20px; border-radius:12px; font-weight:500; opacity:0; pointer-events:none; transition:.25s; max-width:90vw; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .toast.err { background:var(--no); color:#fff; }
  @media (prefers-reduced-motion: reduce) { .skel i { animation:none; } .toast { transition:none; } }

  @media (max-width:680px) {
    main { padding:36px 16px 64px; }
    .search { max-width:none; }
    thead { display:none; }
    table, tbody, tr, td { display:block; width:100%; }
    tbody tr { padding:14px 18px; }
    tbody tr + tr { border-top:1px solid var(--line); }
    tbody tr + tr td { border-top:0; }
    td { padding:4px 0; display:flex; gap:12px; justify-content:space-between; align-items:center; }
    td::before { content:attr(data-label); color:var(--muted); font-size:.86rem; flex:none; }
    td.rate { display:block; }
    td.rate::before { display:block; margin-bottom:4px; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Lab Attendance</h1>
      <p class="lede">Daily attendance for every lab session, pulled live from the class database.</p>
    </div>
    <button class="btn" id="toggleForm" type="button">+ Add record</button>
  </div>

  <form class="panel formpanel" id="addForm" hidden>
    <h2>Add attendance</h2>
    <div class="fields" id="fields"></div>
    <div class="actions">
      <button class="btn" type="submit" id="saveBtn">Save record</button>
      <button class="btn ghost" type="button" id="cancelForm">Close</button>
      <span class="msg" id="msg" aria-live="polite"></span>
    </div>
  </form>

  <section class="stats" aria-label="Summary">
    <div class="stat"><small>Students</small><b id="sStudents">–</b></div>
    <div class="stat"><small>Lab sessions</small><b id="sSessions">–</b></div>
    <div class="stat"><small>Attendance rate</small><b id="sRate">–</b></div>
    <div class="stat"><small>Absences</small><b id="sAbsent">–</b></div>
  </section>

  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search students" autocomplete="off" aria-label="Search records" style="width:100%">
    </label>
    <select id="fSubject" aria-label="Filter by subject" hidden></select>
    <select id="fSection" aria-label="Filter by section" hidden></select>
    <span class="grow"></span>
    <span class="count" id="count" aria-live="polite"></span>
    <button class="btn ghost" id="exportBtn" type="button">Export CSV</button>
  </div>

  <div class="panel"><div class="scroll" id="view"></div></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
  // Palitan kung magbago ang Vercel domain mo (may /api sa dulo)
  const VERCEL_API_URL = 'https://student-api-backend-indol.vercel.app/api';

  const $ = id => document.getElementById(id);
  const view = $('view'), searchEl = $('q'), subjEl = $('fSubject'), sectEl = $('fSection'), countEl = $('count');
  const addForm = $('addForm'), msgEl = $('msg');

  let rows = [], infoCols = [], dates = [], attKey = null, shown = [];
  let keys = { student: null, subject: null, section: null };
  let sortKey = null, sortDir = 1;

  const day = v => String(v).slice(0, 10);
  const isPresent = s => /present/i.test(String(s));
  const getAtt = r => (attKey && Array.isArray(r[attKey])) ? r[attKey] : [];
  const statusOn = (r, d) => { const e = getAtt(r).find(x => day(x.date) === d); return e ? String(e.status) : ''; };
  const presentCount = r => getAtt(r).filter(x => isPresent(x.status)).length;
  const rateOf = r => { const n = getAtt(r).length; return n ? Math.round(presentCount(r) / n * 100) : 0; };

  function pretty(key) {
    const s = key.replace(/[_-]+/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').trim().toLowerCase();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function shortDate(d) {
    const t = new Date(d + 'T00:00:00Z');
    return isNaN(t) ? d : t.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  }
  function valueOf(r, key) {
    if (key === '__rate') return rateOf(r);
    if (key.startsWith('d:')) return statusOn(r, key.slice(2));
    return r[key] ?? '';
  }

  let tt;
  function toast(text, kind) {
    const t = $('toast');
    t.textContent = text;
    t.className = 'toast show ' + (kind || '');
    clearTimeout(tt);
    tt = setTimeout(() => { t.className = 'toast'; }, 3500);
  }

  function showSkeleton() {
    view.innerHTML = '<div class="skel"><i></i><i></i><i></i><i></i><i></i></div>';
  }
  function showState(title, text, retry) {
    view.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'state';
    const s = document.createElement('strong');
    s.textContent = title;
    d.appendChild(s);
    d.appendChild(document.createTextNode(text));
    if (retry) {
      const b = document.createElement('button');
      b.className = 'btn';
      b.type = 'button';
      b.textContent = 'Try again';
      b.addEventListener('click', () => { showSkeleton(); load(); });
      d.appendChild(document.createElement('br'));
      d.appendChild(b);
    }
    view.appendChild(d);
  }

  function updateStats(list) {
    let entries = 0, present = 0;
    list.forEach(r => { entries += getAtt(r).length; present += presentCount(r); });
    $('sStudents').textContent = list.length;
    $('sSessions').textContent = dates.length;
    $('sRate').textContent = entries ? Math.round(present / entries * 100) + '%' : '–';
    $('sAbsent').textContent = entries - present;
  }

  function getColumns() {
    const cols = infoCols.map(c => ({ key: c, label: pretty(c) }));
    dates.forEach(d => cols.push({ key: 'd:' + d, label: shortDate(d) }));
    if (attKey) cols.push({ key: '__rate', label: 'Attendance' });
    return cols;
  }

  function render() {
    const term = searchEl.value.trim().toLowerCase();
    const sub = subjEl.value, sec = sectEl.value;
    let list = rows.filter(r =>
      (!term || infoCols.some(c => String(r[c] ?? '').toLowerCase().includes(term))) &&
      (!sub || r[keys.subject] === sub) && (!sec || r[keys.section] === sec));

    if (sortKey) {
      list = list.slice().sort((a, b) =>
        String(valueOf(a, sortKey)).localeCompare(String(valueOf(b, sortKey)), undefined, { numeric: true }) * sortDir);
    }
    shown = list;
    countEl.textContent = list.length + (list.length === 1 ? ' student' : ' students');
    updateStats(list);

    if (!list.length) { showState('No matching records', 'Try a different search or filter.'); return; }

    const cols = getColumns();
    const table = document.createElement('table');
    const head = table.createTHead().insertRow();
    cols.forEach(c => {
      const th = document.createElement('th');
      th.scope = 'col';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = c.label;
      if (sortKey === c.key) {
        const a = document.createElement('span');
        a.className = 'arrow';
        a.textContent = sortDir === 1 ? '▲' : '▼';
        btn.appendChild(a);
      }
      btn.addEventListener('click', () => { sortDir = sortKey === c.key ? -sortDir : 1; sortKey = c.key; render(); });
      th.appendChild(btn);
      head.appendChild(th);
    });

    const body = table.createTBody();
    list.forEach(r => {
      const tr = body.insertRow();
      cols.forEach(c => {
        const td = tr.insertCell();
        td.dataset.label = c.label;
        if (c.key === '__rate') {
          td.className = 'rate';
          const pct = rateOf(r);
          td.appendChild(document.createTextNode(pct + '%'));
          const bar = document.createElement('div');
          bar.className = 'bar';
          const fill = document.createElement('i');
          fill.style.width = pct + '%';
          bar.appendChild(fill);
          td.appendChild(bar);
        } else if (c.key.startsWith('d:')) {
          const st = statusOn(r, c.key.slice(2));
          if (!st) { td.innerHTML = '<span class="dim">—</span>'; }
          else {
            const b = document.createElement('span');
            b.className = 'badge ' + (isPresent(st) ? 'ok' : 'no');
            b.textContent = st;
            td.appendChild(b);
          }
        } else if (c.key === keys.section) {
          const p = document.createElement('span');
          p.className = 'pill';
          p.textContent = r[c.key] ?? '—';
          td.appendChild(p);
        } else {
          td.textContent = r[c.key] ?? '—';
          if (c.key === keys.student) td.className = 'primary';
        }
      });
    });
    view.innerHTML = '';
    view.appendChild(table);
  }

  function fillFilter(sel, key, allLabel) {
    if (!key) { sel.hidden = true; return; }
    const keep = sel.value;
    sel.innerHTML = '';
    const all = document.createElement('option');
    all.value = '';
    all.textContent = allLabel;
    sel.appendChild(all);
    Array.from(new Set(rows.map(r => r[key]).filter(Boolean))).sort().forEach(v => {
      const o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      sel.appendChild(o);
    });
    sel.value = Array.from(sel.options).some(o => o.value === keep) ? keep : '';
    sel.hidden = false;
  }

  function exportCsv() {
    const cols = getColumns().filter(c => c.key !== '__rate');
    const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = [cols.map(c => esc(c.label)).concat(esc('Attendance %')).join(',')];
    shown.forEach(r => lines.push(cols.map(c => esc(valueOf(r, c.key))).concat(rateOf(r)).join(',')));
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lab-attendance.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  /* ---------- Add record form ---------- */
  function setMsg(text, err) { msgEl.textContent = text; msgEl.className = 'msg' + (err ? ' err' : ''); }

  function buildForm() {
    const box = $('fields');
    box.innerHTML = '';
    const add = (label, input, extra) => {
      const l = document.createElement('label');
      const t = document.createElement('span');
      t.textContent = label;
      l.appendChild(t);
      l.appendChild(input);
      if (extra) l.appendChild(extra);
      box.appendChild(l);
    };

    infoCols.forEach(c => {
      const input = document.createElement('input');
      input.type = 'text';
      input.name = 'f_' + c;
      input.required = true;
      input.autocomplete = 'off';
      input.maxLength = 100;
      const dl = document.createElement('datalist');
      dl.id = 'dl_' + c;
      Array.from(new Set(rows.map(r => r[c]).filter(Boolean))).sort().forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        dl.appendChild(o);
      });
      input.setAttribute('list', dl.id);
      if (c === keys.student) {
        input.addEventListener('change', () => {
          const found = rows.find(r => r[c] === input.value.trim());
          if (!found) return;
          infoCols.forEach(o => { if (o !== c) addForm.elements['f_' + o].value = found[o] ?? ''; });
        });
      }
      add(pretty(c), input, dl);
    });

    const date = document.createElement('input');
    date.type = 'date';
    date.name = 'date';
    date.required = true;
    date.value = new Date().toISOString().slice(0, 10);
    add('Date', date);

    const status = document.createElement('select');
    status.name = 'status';
    ['Present', 'Absent'].forEach(v => {
      const o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      status.appendChild(o);
    });
    add('Status', status);

    const pass = document.createElement('input');
    pass.type = 'password';
    pass.name = 'passcode';
    pass.required = true;
    pass.autocomplete = 'off';
    add('Passcode', pass);
  }

  $('toggleForm').addEventListener('click', () => {
    addForm.hidden = !addForm.hidden;
    if (!addForm.hidden) { setMsg(''); const f = addForm.querySelector('input'); if (f) f.focus(); }
  });
  $('cancelForm').addEventListener('click', () => { addForm.hidden = true; });

  addForm.addEventListener('submit', async e => {
    e.preventDefault();
    const match = {};
    infoCols.forEach(c => { match[c] = addForm.elements['f_' + c].value.trim(); });
    const btn = $('saveBtn');
    btn.disabled = true;
    setMsg('Saving…');
    try {
      const res = await fetch(VERCEL_API_URL + '/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-passcode': addForm.elements.passcode.value },
        body: JSON.stringify({
          match, attKey: attKey || 'attendance',
          date: addForm.elements.date.value, status: addForm.elements.status.value
        })
      });
      if (res.status === 401) { setMsg('Wrong passcode. Try again.', true); return; }
      if (!res.ok) { setMsg('Could not save. Check the fields and try again.', true); return; }
      const out = await res.json();
      await load();
      setMsg('');
      toast(out.updated ? 'Attendance updated' : 'Record saved');
    } catch (err) {
      setMsg('Could not reach the server. Check your connection.', true);
    } finally {
      btn.disabled = false;
    }
  });

  /* ---------- Load ---------- */
  async function load() {
    try {
      const res = await fetch(VERCEL_API_URL);
      if (!res.ok) throw new Error('Request failed');
      const data = await res.json();
      if (!Array.isArray(data) || !data.length) {
        countEl.textContent = '';
        updateStats([]);
        showState('No records yet', 'Attendance entries will appear here once they are added.');
        return;
      }
      rows = data;

      const all = [];
      data.forEach(r => Object.keys(r).forEach(k => { if (k !== '_id' && k !== '__v' && !all.includes(k)) all.push(k); }));
      attKey = all.find(k => data.some(r => Array.isArray(r[k]) && r[k].length && typeof r[k][0] === 'object')) || null;

      const rank = k => /student/i.test(k) ? 0 : /subject/i.test(k) ? 1 : /section/i.test(k) ? 2 : 3;
      infoCols = all.filter(k => k !== attKey).sort((a, b) => rank(a) - rank(b));
      keys = {
        student: infoCols.find(k => /student/i.test(k)) || null,
        subject: infoCols.find(k => /subject/i.test(k)) || null,
        section: infoCols.find(k => /section/i.test(k)) || null
      };

      const set = new Set();
      data.forEach(r => getAtt(r).forEach(x => set.add(day(x.date))));
      dates = Array.from(set).sort();

      if (!sortKey || !infoCols.includes(sortKey) && !sortKey.startsWith('d:') && sortKey !== '__rate') {
        sortKey = keys.student || infoCols[0] || null;
        sortDir = 1;
      }

      fillFilter(subjEl, keys.subject, 'All subjects');
      fillFilter(sectEl, keys.section, 'All sections');
      buildForm();
      render();
    } catch (err) {
      countEl.textContent = '';
      showState('Could not load records', 'Check your connection and try again. If it keeps happening, the API may be offline.', true);
    }
  }

  searchEl.addEventListener('input', render);
  subjEl.addEventListener('change', render);
  sectEl.addEventListener('change', render);
  $('exportBtn').addEventListener('click', () => { if (shown.length) exportCsv(); else toast('Nothing to export', 'err'); });

  showSkeleton();
  load();
</script>
</body>
</html>
